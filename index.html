<!DOCTYPE html>
<html lang="su"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monopoli Carita Wayang</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#1d2b64;--gold:#ffb703;--teal:#0ea5a0;--pink:#ec4899;--sky:#dff3ff;--u:calc(min(96vw,92vh)/8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 15%,#fff6c9 0,transparent 35%),radial-gradient(circle at 85% 80%,#c8f5ee 0,transparent 40%),var(--sky);display:flex;justify-content:center;align-items:center;min-height:100vh}
h1,h2,.disp{font-family:'Baloo 2',Nunito,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:.6em 1.1em;font-weight:800;color:#fff;background:var(--teal);box-shadow:0 4px 0 #0a7773;transition:transform .1s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0a7773}
button:disabled{background:#b6bfd1;box-shadow:0 4px 0 #8c96ab;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
/* setup */
#setup{width:min(94vw,760px);background:#fff;border-radius:28px;padding:clamp(16px,3vw,32px);box-shadow:0 12px 0 #c9d6ee,0 20px 40px #1d2b6422;margin:12px}
#setup h1{font-size:clamp(28px,5vw,46px);line-height:1.05;text-align:center}
.hero{font-size:clamp(40px,8vw,64px);text-align:center;letter-spacing:.15em}
.how{background:#fff7d6;border-radius:16px;padding:10px 16px;margin:12px 0;font-size:15px}
.how p{margin:4px 0}
.cnt{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.cnt button{background:#e7edfb;color:var(--ink);box-shadow:0 4px 0 #c0cce8;min-width:48px}
.cnt button.sel{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0e1740}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:8px 10px;border-radius:16px;background:#f3f7ff;border-left:8px solid var(--c)}
.row input{flex:1 1 150px;font:inherit;font-weight:700;padding:.55em .8em;border:2px solid #c0cce8;border-radius:12px;min-width:0}
.row input.err{border-color:#e11d48;background:#fff1f3}
.pk{display:flex;gap:6px}
.pk button{background:#fff;color:inherit;box-shadow:0 3px 0 #c0cce8;font-size:26px;padding:.1em .3em;border:2px solid #c0cce8}
.pk button.sel{border-color:var(--c);background:#fff3c4;box-shadow:0 3px 0 var(--c)}
.pk button:disabled{opacity:.3;box-shadow:none}
#serr{color:#e11d48;font-weight:800;text-align:center;min-height:1.4em}
#goBtn{display:block;margin:6px auto 0;font-size:22px;background:var(--pink);box-shadow:0 5px 0 #a8206a;padding:.55em 1.6em}
/* board */
#game{display:flex;justify-content:center;align-items:center;width:100%}
#board{position:relative;width:calc(var(--u)*8);height:calc(var(--u)*8);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);gap:calc(var(--u)*.03);background:var(--ink);padding:calc(var(--u)*.03);border-radius:calc(var(--u)*.25);box-shadow:0 10px 0 #0e1740,0 18px 30px #1d2b6444}
.tile{background:#fff;border-radius:calc(var(--u)*.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--u)*.17);font-weight:800;text-align:center;line-height:1.05;overflow:hidden}
.tile b{font:800 calc(var(--u)*.38)/1 'Baloo 2',sans-serif}
.tile .e{font-size:calc(var(--u)*.24)}
.tile.Q{border-bottom:calc(var(--u)*.06) solid #0003}.tile svg{width:calc(var(--u)*.46);height:calc(var(--u)*.38);flex:none}
.tile.C{background:linear-gradient(160deg,#ffe28a,var(--gold))}
.tile.R{background:linear-gradient(160deg,#ffc2dd,var(--pink));color:#fff}
.tile.S{background:linear-gradient(160deg,#9af0c0,#22c55e);color:#064e2b}
.pawn{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;transition:left .26s ease,top .26s ease;z-index:5;pointer-events:none}
.pawn span{display:grid;place-items:center;width:calc(var(--u)*.6);height:calc(var(--u)*.6);border-radius:50%;background:var(--c);border:3px solid #fff;font-size:calc(var(--u)*.4);box-shadow:0 3px 6px #0006}
.p0 span{transform:translate(calc(var(--u)*-.13),calc(var(--u)*-.13))}.p1 span{transform:translate(calc(var(--u)*.13),calc(var(--u)*-.13))}
.p2 span{transform:translate(calc(var(--u)*-.13),calc(var(--u)*.13))}.p3 span{transform:translate(calc(var(--u)*.13),calc(var(--u)*.13))}
.pawn.act{z-index:6}.pawn.act span{animation:hop .7s infinite;box-shadow:0 0 0 4px var(--gold),0 3px 6px #0006}
@keyframes hop{50%{margin-top:calc(var(--u)*-.1)}}
#center{grid-area:2/2/8/8;background:linear-gradient(160deg,#f4fbff,#fff4cf);border-radius:calc(var(--u)*.14);padding:calc(var(--u)*.12);display:flex;flex-direction:column;gap:calc(var(--u)*.1);font-size:max(9px,calc(var(--u)*.19));overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ttl{font:800 max(13px,calc(var(--u)*.3))/1 'Baloo 2',sans-serif}
#gt{font:800 max(14px,calc(var(--u)*.3))/1 'Baloo 2';background:var(--ink);color:#fff;padding:.25em .6em;border-radius:12px}
#gt.low{background:#e11d48;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#aud{padding:.3em .6em;background:var(--gold);box-shadow:0 3px 0 #b27f00;color:var(--ink)}
#plist{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*.08)}
.pc{display:flex;gap:.5em;align-items:center;background:#fff;border-radius:12px;padding:.4em .6em;border:3px solid transparent;border-left:calc(var(--u)*.1) solid var(--c);min-width:0}
.pc.cur{border-color:var(--gold);background:#fff9e0;box-shadow:0 0 0 2px var(--gold)}
.pc.dead{opacity:.5;filter:grayscale(1)}
.pc .pe{font-size:2.2em}
.pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.pop .sc{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.5);color:var(--pink)}}
.sc{display:inline-block}
.mid{display:flex;gap:calc(var(--u)*.2);align-items:center;justify-content:center;flex:1;min-height:0}
.scene{perspective:600px;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);display:grid;place-items:center;--s:calc(var(--u)*.85)}
.dice{width:var(--s);height:var(--s);transform-style:preserve-3d}
#cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(25deg);transition:transform 1s cubic-bezier(.2,.8,.3,1)}
.dice.shake{animation:shake .12s 7}
@keyframes shake{25%{translate:4px -4px}75%{translate:-4px 4px}}
.f{position:absolute;inset:0;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);border-radius:12px;font:800 calc(var(--s)*.55)/1 'Baloo 2',sans-serif;backface-visibility:hidden}
.f1{transform:translateZ(calc(var(--s)/2))}.f2{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.f3{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}.f5{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f{backface-visibility:visible}
.ctl{display:flex;flex-direction:column;gap:.5em;align-items:flex-start;max-width:60%}
#turn{font-size:1.15em;background:var(--gold);padding:.3em .8em;border-radius:12px}
#rollbtn{font-size:1.25em;background:var(--pink);box-shadow:0 4px 0 #a8206a;padding:.6em 1.2em}
#msg{min-height:2.4em;font-weight:700}
/* modal & toast */
#modal,#end{position:fixed;inset:0;background:#0e174088;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;overflow:auto}
.box{background:#fff;border-radius:26px;padding:clamp(16px,3vw,28px);width:min(94vw,600px);box-shadow:0 10px 0 #c9d6ee;animation:in .3s}
@keyframes in{from{transform:scale(.8);opacity:0}}
.qh{font-weight:800;color:var(--teal)}
.qt{font:600 clamp(18px,3vw,24px)/1.3 'Baloo 2',sans-serif;margin:8px 0 12px}
.bar{height:12px;background:#e7edfb;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .1s linear,background .3s}
#ts{text-align:right;font-weight:800;margin:2px 0 8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#eef3ff;color:var(--ink);box-shadow:0 4px 0 #c0cce8;font-size:clamp(15px,2.2vw,18px)}
.opt.ok{background:#22c55e;color:#fff;box-shadow:0 4px 0 #15803d}.opt.no{background:#e11d48;color:#fff;box-shadow:0 4px 0 #9f1239}
.cd{text-align:center}.cd .big{font-size:70px;animation:flip .8s}.cd .big svg{width:96px;height:80px}.cd p{font-size:20px;font-weight:800}
.cd.ch h2{color:#b27f00}.cd.rk h2{color:var(--pink)}
@keyframes flip{from{transform:rotateY(360deg) scale(.3)}}
#toast{position:fixed;top:14px;left:50%;translate:-50% 0;background:var(--ink);color:#fff;padding:.6em 1.2em;border-radius:99px;font-weight:800;z-index:60;box-shadow:0 6px 18px #0005;animation:in .3s}
table{width:100%;border-collapse:collapse;margin:12px 0}
td,th{padding:8px 6px;text-align:left;border-bottom:2px solid #e7edfb}
tr.win td{background:#fff3c4;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<div id="setup">
 <div class="hero" aria-hidden="true">🎭 ⚔️ 🏹</div>
 <h1>Monopoli Carita Wayang</h1>
 <div class="how">
  <p>🎲 Lémpar dadu, gerakkeun pion, tuluy jawab soal di unggal petak.</p>
  <p>✅ Bener +5 poin. ❌ Salah atawa waktuna béak (15 detik) leungit 1 ❤️ tina 3 nyawa.</p>
  <p>⏱ Kaulinan lumangsung 5 menit. Skor panggedéna jadi juara.</p>
 </div>
 <div class="cnt"><b>Jumlah pamaén:</b><span id="cbtns"></span></div>
 <div id="rows"></div>
 <div id="serr" role="alert"></div>
 <button id="goBtn">Mimitian Kaulinan</button>
</div>
<div id="game" class="hide"><div id="board"><div id="center">
 <div class="top"><div class="ttl">🎭 Carita Wayang</div><div id="gt">⏱ 5:00</div><button id="aud" aria-label="Audio">🔊 ON</button></div>
 <div id="plist"></div>
 <div class="mid"><div class="scene"><div class="dice" id="dice"><div id="cube"><div class="f f1">1</div><div class="f f2">2</div><div class="f f3">3</div><div class="f f4">4</div><div class="f f5">5</div><div class="f f6">6</div></div></div></div>
 <div class="ctl"><div id="turn"></div><button id="rollbtn">🎲 Lémpar Dadu</button><div id="msg"></div></div></div>
</div></div></div>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<div id="end" class="hide"><div class="box" id="ebox"></div></div>
<script>
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PAWNS=[['🧑‍⚕️','Dokter'],['🕵️','Détéktif'],['🧑‍🔬','Élmuwan'],['🧑‍🏫','Guru']];
const COL=['#ef4444','#3b82f6','#16a34a','#a855f7'];
// Soal: [pertanyaan, benar, salah1, salah2, salah3]
const Q=[
["Kecap wayang asalna tina kecap bayang anu hartina ...","Kalangkang (bayangan)","Bonéka","Carita","Kawih"],
["Carita induk (babon) carita wayang asalna tina ...","Mahabarata jeung Ramayana","Sangkuriang jeung Lutung Kasarung","Ciung Wanara jeung Mundinglaya","Si Kabayan jeung Nyi Iteung"],
["Puisi atawa kawih basa Kawi anu dialunkeun ku dalang pikeun ngéndahkeun suasana disebut ...","Kakawén (Suluk)","Antawacana","Nyandra","Sabet"],
["Suluk bubuka anu dikawihkeun ku dalang dina awal pagelaran wayang disebut ...","Murwa","Nyandra","Renggep","Tutug"],
["Gambaran suasana pagelaran atawa panggung maké basa gancaran (prosa) disebut ...","Nyandra","Kakawén","Murwa","Antawacana"],
["Obrolan antara tokoh wayang anu diucapkeun ku dalang maké sora anu béda-béda disebut ...","Antawacana","Nyandra","Sabet","Kawiradya"],
["Santikaning dalang anu hartina bisa narik perhatian panongton nyaéta ...","Renggep","Tutug","Sabet","Antawacana"],
["Dalang anu nguasaan alur carita jeung dramaturgi miboga kaahlian ...","Tutug","Renggep","Sabet","Paramakawi"],
["Kaparigelan dalang ngagerakkeun wayang disebut ...","Sabet","Tutug","Renggep","Murwa"],
["Nguasaan lagu, istilah, jeung basa Kawi kaasup kaahlian ...","Kawiradya jeung Paramakawi","Sabet","Renggep","Tutug"],
["Wayang kulit anu lakonna Mahabarata jeung Ramayana nyaéta wayang ...","Purwa","Golék","Wong","Béber"],
["Wayang tina kai anu pohara kasohorna di Jawa Barat nyaéta wayang ...","Golék","Purwa","Béber","Wong"],
["Wayang anu dilukis dina lawon disebut wayang ...","Béber (Béban)","Golék","Wong","Purwa"],
["Wayang anu dimaénkeun langsung ku manusa disebut wayang ...","Wong","Golék","Béber","Purwa"],
["Pandawa nyaéta lima dulur putra ...","Pandu Dewanata","Destarastra","Abyasa","Duryudana"],
["Tokoh ieu di handap anu kaasup Pandawa nyaéta ...","Arjuna","Duryudana","Dursasana","Destarastra"],
["Jumlah dulur Kurawa nyaéta ...","100 urang","5 urang","50 urang","12 urang"],
["Kurawa dipingpin ku ...","Duryudana jeung Dursasana","Yudistira jeung Bima","Arjuna jeung Nakula","Pandu jeung Abyasa"],
["Pandu jeung Destarastra téh putra ...","Abyasa","Duryudana","Yudistira","Bima"],
["Indung para Pandawa nyaéta ...","Dewi Kunti jeung Dewi Madrim","Dewi Gandari jeung Dewi Kunti","Dewi Madrim jeung Dewi Gandari","Dewi Sinta jeung Dewi Kunti"]];
// Papan: 28 petak jalur berlawanan arah jarum jam dari START (kanan bawah)
const TY="SQQQCQQQ"+"QQRQQCQ"+"QQRQQCQ"+"QRQQCQ";
const NUM=[];let _n=0;for(const t of TY)NUM.push(t==='Q'?++_n:0);
const PAS=['#fff0a8','#ffd0e0','#cfe8ff','#d6f5c4','#e3d4ff'];
const IC={cards:'<svg viewBox="0 0 60 50"><g stroke="#1d2b64" stroke-width="2.5"><rect x="4" y="8" width="26" height="34" rx="5" fill="#ec4899" transform="rotate(-14 17 25)"/><rect x="16" y="6" width="26" height="34" rx="5" fill="#3b82f6" transform="rotate(-2 29 23)"/><rect x="28" y="8" width="26" height="34" rx="5" fill="#84cc16" transform="rotate(12 41 25)"/></g><text x="41" y="33" font-size="20" font-weight="800" fill="#1d2b64" text-anchor="middle">?</text></svg>',arrow:'<svg viewBox="0 0 60 50"><path d="M8 38 Q14 12 44 16" fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/><path d="M38 4 L56 18 L36 30 Z" fill="#f59e0b"/></svg>',bomb:'<svg viewBox="0 0 60 50"><circle cx="28" cy="31" r="16" fill="#1f2937"/><path d="M38 17 Q46 9 50 12" stroke="#92400e" stroke-width="4" fill="none"/><path d="M50 3 l3 6 6-1-4 5 4 5-6-1-3 6-3-6-6 1 4-5-4-5 6 1z" fill="#facc15" stroke="#ef4444" stroke-width="1.5"/><circle cx="22" cy="25" r="4" fill="#fff" opacity=".4"/></svg>',flag:'<svg viewBox="0 0 60 50"><path d="M8 46 Q30 36 52 46 Z" fill="#16a34a"/><rect x="28" y="6" width="4" height="38" fill="#7c4a1e"/><path d="M32 7 L54 14 L32 22 Z" fill="#ef4444"/></svg>',dice:'<svg viewBox="0 0 60 50"><rect x="12" y="4" width="38" height="38" rx="8" fill="#fff" stroke="#1d2b64" stroke-width="3"/><g fill="#1d2b64"><circle cx="23" cy="15" r="3.5"/><circle cx="39" cy="15" r="3.5"/><circle cx="31" cy="23" r="3.5"/><circle cx="23" cy="31" r="3.5"/><circle cx="39" cy="31" r="3.5"/></g></svg>'};
const XY=i=>i<=7?[8-i,8]:i<=14?[1,8-(i-7)]:i<=21?[1+(i-14),1]:[8,1+(i-21)];
// Audio
let AC=null,AUD=true,bgmT=null;
function beep(f,d=.15,t='sine',v=.12,dl=0){if(!AUD||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+dl;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}
const seq=(n,t,gap,d,v)=>n.forEach((f,i)=>beep(f,d,t,v,i*gap));
const SFX={roll:()=>seq([300,240,360,280,400,320,380],'square',.1,.08,.06),step:()=>beep(520,.08,'triangle',.12),ok:()=>seq([523,659,784],'sine',.1,.2),bad:()=>seq([220,165],'sawtooth',.14,.25,.08),life:()=>seq([330,247,196],'triangle',.12,.25),bonus:()=>seq([660,880,1100,1320],'sine',.08,.18),risk:()=>seq([300,200,140],'sawtooth',.12,.25,.08),over:()=>seq([262,220,196,147],'sawtooth',.2,.35,.08),win:()=>seq([523,659,784,1047,784,1047],'triangle',.15,.3)};
const sfx=n=>SFX[n]&&SFX[n]();
function bgm(on){clearInterval(bgmT);if(!on)return;const sc=[262,294,330,392,440,523,588];let i=2;bgmT=setInterval(()=>{if(!AUD||!AC)return;i=Math.max(0,Math.min(6,i+pick([-2,-1,1,2])));beep(sc[i],.5,'triangle',.035)},480)}
// Setup
let cnt=2,names=['','','',''],picks=[null,null,null,null];
function renderSetup(){
 $('#cbtns').innerHTML=[1,2,3,4].map(n=>`<button class="${n==cnt?'sel':''}" data-n="${n}">${n}</button>`).join(' ');
 $('#rows').innerHTML=Array.from({length:cnt},(_,i)=>`<div class="row" style="--c:${COL[i]}"><b>P${i+1}</b><input data-i="${i}" maxlength="12" placeholder="Ngaran pamaén ${i+1}" value="${esc(names[i])}" aria-label="Ngaran pamaén ${i+1}"><div class="pk">${PAWNS.map((p,j)=>`<button data-i="${i}" data-j="${j}" title="${p[1]}" class="${picks[i]===j?'sel':''}" ${picks.some((x,k)=>k<cnt&&k!==i&&x===j)?'disabled':''}>${p[0]}</button>`).join('')}</div></div>`).join('');
}
$('#cbtns').onclick=e=>{const n=e.target.dataset.n;if(n){cnt=+n;renderSetup()}};
$('#rows').oninput=e=>{if(e.target.dataset.i!==undefined){names[e.target.dataset.i]=e.target.value;e.target.classList.remove('err')}};
$('#rows').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled){picks[b.dataset.i]=+b.dataset.j;renderSetup()}};
$('#goBtn').onclick=()=>{
 let bad=false;
 for(let i=0;i<cnt;i++){if(!names[i].trim()){bad=true;$(`input[data-i="${i}"]`).classList.add('err')}}
 if(bad){$('#serr').textContent='Eusian heula ngaran unggal pamaén.';return}
 if(picks.slice(0,cnt).some(x=>x===null)){$('#serr').textContent='Unggal pamaén kudu milih hiji pion.';return}
 $('#serr').textContent='';if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume();startGame();
};
// Game
let G=null;
function buildBoard(){
 const b=$('#board');b.querySelectorAll('.tile,.pawn').forEach(e=>e.remove());
 [...TY].forEach((t,i)=>{const [r,c]=XY(i),d=document.createElement('div');d.className='tile '+t;d.style.gridArea=`${r}/${c}`;
  d.innerHTML=t==='Q'?`${IC.cards}<b>${NUM[i]}</b>`:t==='C'?`${IC.arrow}Kasempetan`:t==='R'?`${IC.bomb}Résiko`:`${IC.flag}Titik Awal`;if(t==='Q')d.style.background=PAS[i%5];b.appendChild(d)});
 G.pl.forEach((p,i)=>{const d=document.createElement('div');d.className='pawn p'+i;d.id='pw'+i;d.style.setProperty('--c',COL[i]);d.innerHTML=`<span>${p.pawn}</span>`;b.appendChild(d);placePawn(i)});
}
function placePawn(i){const [r,c]=XY(G.pl[i].pos),e=$('#pw'+i);e.style.left=(c-1)*12.5+'%';e.style.top=(r-1)*12.5+'%'}
function startGame(){
 G={pl:Array.from({length:cnt},(_,i)=>({name:names[i].trim(),pawn:PAWNS[picks[i]][0],score:0,lives:3,pos:0,correct:0,over:false})),cur:0,phase:'idle',time:300,ended:false,pool:[]};
 $('#setup').classList.add('hide');$('#game').classList.remove('hide');$('#end').classList.add('hide');
 buildBoard();updateTime();render();$('#msg').textContent='Pencét Lémpar Dadu pikeun ngamimitian!';
 G.gi=setInterval(()=>{G.time--;updateTime();if(G.time<=0)endGame()},1000);bgm(AUD);
 document.querySelectorAll('.pawn').forEach((e,i)=>e.classList.toggle('act',i===G.cur));
}
function updateTime(){const m=Math.floor(G.time/60),s=G.time%60;$('#gt').textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;$('#gt').classList.toggle('low',G.time<=30)}
const hearts=l=>'❤️'.repeat(l)+'🖤'.repeat(3-l);
function render(flash=-1){
 $('#plist').innerHTML=G.pl.map((p,i)=>`<div class="pc ${i===G.cur&&!G.ended?'cur':''} ${p.over?'dead':''} ${i===flash?'pop':''}" style="--c:${COL[i]}"><span class="pe">${p.pawn}</span><div style="min-width:0"><b>${esc(p.name)}</b><div>⭐ <span class="sc">${p.score}</span> ${p.over?'Game Over':hearts(p.lives)}</div></div></div>`).join('');
 const c=G.pl[G.cur];$('#turn').innerHTML=`Giliran: <b>${c.pawn} ${esc(c.name)}</b>`;
 $('#rollbtn').disabled=G.phase!=='idle'||G.ended;
 document.querySelectorAll('.pawn').forEach((e,i)=>e.classList.toggle('act',i===G.cur&&!G.ended));
}
function toast(t){const d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.remove('hide')}
const closeModal=()=>$('#modal').classList.add('hide');
function addScore(p,n){p.score=Math.max(0,p.score+n);render(G.pl.indexOf(p))}
const ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};let spin=0;
$('#rollbtn').onclick=roll;
async function roll(){
 if(G.phase!=='idle'||G.ended)return;G.phase='rolling';render();
 const p=G.pl[G.cur],n=1+Math.floor(Math.random()*6);
 $('#msg').textContent='Dadu muter...';sfx('roll');$('#dice').classList.add('shake');
 spin++;const [x,y]=ROT[n];$('#cube').style.transform=`rotateX(${x-720*spin}deg) rotateY(${y-720*spin}deg)`;
 await sleep(1100);$('#dice').classList.remove('shake');if(G.ended)return;
 $('#msg').textContent=`${p.name} meunang ${n} léngkah`;await sleep(500);
 await move(p,n);if(G.ended)return;await resolve(p);if(G.ended)return;nextTurn();
}
async function move(p,steps){
 const i=G.pl.indexOf(p);
 for(let k=0;k<steps;k++){
  if(G.ended)return;p.pos=(p.pos+1)%28;placePawn(i);sfx('step');
  if(p.pos===0){addScore(p,10);toast('🏁 Ngaliwatan START! Bonus +10');sfx('bonus')}
  await sleep(320);
 }
}
async function back(p,n){const i=G.pl.indexOf(p);for(let k=0;k<n;k++){if(G.ended)return;p.pos=(p.pos+27)%28;placePawn(i);sfx('step');await sleep(320)}}
async function resolve(p){
 const t=TY[p.pos];
 if(t==='Q')await ask(p);else if(t==='C'||t==='R')await card(p,t);else $('#msg').textContent='Eureun di START. Aman!';
}
function ask(p){return new Promise(res=>{
 G.qRes=res;if(!G.pool.length)G.pool=shuf([...Q.keys()]);
 const q=Q[G.pool.pop()],opts=shuf(q.slice(1));let t=150,done=false;
 modal(`<div class="qh">Soal petak ${NUM[p.pos]} · ${p.pawn} ${esc(p.name)}</div><div class="qt">${q[0]}</div><div class="bar"><i id="bi"></i></div><div id="ts">15 detik</div><div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}">${'ABCD'[i]}. ${o}</button>`).join('')}</div>`);
 const btns=[...document.querySelectorAll('.opt')];
 const fin=async sel=>{
  if(done)return;done=true;clearInterval(G.qi);btns.forEach(b=>b.disabled=true);
  btns.forEach((b,i)=>{if(opts[i]===q[1])b.classList.add('ok');else if(i===sel)b.classList.add('no')});
  if(sel>=0&&opts[sel]===q[1]){p.correct++;addScore(p,5);sfx('ok');$('#msg').textContent=`${p.name} bener! +5 poin`}
  else{p.lives--;sfx('bad');setTimeout(()=>sfx('life'),350);$('#msg').textContent=sel<0?`Waktuna béak! ${p.name} leungit 1 nyawa`:`Jawaban salah. ${p.name} leungit 1 nyawa`;
   if(p.lives<=0){p.over=true;setTimeout(()=>sfx('over'),700);toast(`💀 ${p.name} Game Over`)}render(G.pl.indexOf(p))}
  await sleep(1500);closeModal();res();
 };
 btns.forEach((b,i)=>b.onclick=()=>fin(i));
 G.qi=setInterval(()=>{t--;$('#bi').style.width=t/1.5+'%';$('#bi').style.background=t<50?'#e11d48':'';$('#ts').textContent=Math.ceil(t/10)+' detik';if(t<=0)fin(-1)},100);
})}
async function card(p,k){
 const C=k==='C';
 const list=C?[{t:'Bonus +10 poin!',f:p=>addScore(p,10)},{t:'Bonus +5 poin!',f:p=>addScore(p,5)},{t:'Bonus +15 poin!',f:p=>addScore(p,15)},{t:'Maju 2 léngkah!',m:2,ic:IC.arrow},{t:'Maju 3 léngkah!',m:3,ic:IC.arrow}]
  :[{t:'Skor kakurangan 5 poin.',f:p=>addScore(p,-5)},{t:'Skor kakurangan 10 poin.',f:p=>addScore(p,-10)},{t:'Balik deui ka START!',ic:IC.bomb,f:p=>{p.pos=0;placePawn(G.pl.indexOf(p))}},{t:'Mundur 3 léngkah!',mb:3,ic:IC.dice},{t:'Mundur 2 léngkah!',mb:2,ic:IC.dice}];
 const e=pick(list);
 modal(`<div class="cd ${C?'ch':'rk'}"><div class="big">${e.ic||(C?'✨':'⚠️')}</div><h2>${C?'Kartu Kasempetan':'Kartu Résiko'}</h2><p>${e.t}</p></div>`);
 sfx(C?'bonus':'risk');$('#msg').textContent=`${p.name}: ${e.t}`;
 if(e.f)e.f(p);await sleep(2300);closeModal();if(G.ended)return;
 if(e.m){await move(p,e.m);if(G.ended)return;await resolve(p)}
 if(e.mb){await back(p,e.mb);if(G.ended)return;await resolve(p)}
}
function nextTurn(){
 if(G.ended)return;
 if(G.pl.every(p=>p.over)){endGame();return}
 do{G.cur=(G.cur+1)%G.pl.length}while(G.pl[G.cur].over);
 G.phase='idle';render();
}
function endGame(){
 if(!G||G.ended)return;G.ended=true;clearInterval(G.gi);clearInterval(G.qi);bgm(false);closeModal();G.qRes&&G.qRes();render();
 const r=[...G.pl].sort((a,b)=>b.score-a.score||b.correct-a.correct),top=r[0];
 const tie=r.filter(p=>p.score===top.score&&p.correct===top.correct);
 $('#ebox').innerHTML=`<div class="cd"><div class="big">🏆</div><h2>${G.time<=0?'Waktuna béak!':'Sadaya pamaén Game Over'}</h2><p>${tie.length>1?'Skor sarua: '+tie.map(p=>p.pawn+' '+esc(p.name)).join(' & '):'Juara: '+top.pawn+' '+esc(top.name)}</p></div>
 <table><tr><th>#</th><th>Pamaén</th><th>Skor</th><th>Bener</th><th>Status</th></tr>${r.map((p,i)=>`<tr class="${tie.includes(p)?'win':''}"><td>${i+1}</td><td>${p.pawn} ${esc(p.name)}</td><td>${p.score}</td><td>${p.correct}</td><td>${p.over?'Game Over':hearts(p.lives)}</td></tr>`).join('')}</table>
 <button id="again" style="display:block;margin:auto;font-size:20px">Maén Deui</button>`;
 $('#end').classList.remove('hide');sfx('win');
 $('#again').onclick=()=>{$('#end').classList.add('hide');$('#game').classList.add('hide');$('#setup').classList.remove('hide');names=['','','',''];picks=[null,null,null,null];G=null;renderSetup()};
}
$('#aud').onclick=()=>{AUD=!AUD;$('#aud').textContent=AUD?'🔊 ON':'🔇 OFF';if(G&&!G.ended)bgm(AUD)};
renderSetup();
</script></body></html>
